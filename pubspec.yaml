name: mobile_dev
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"


dependencies:
  equatable: ^2.0.5
  flutter_bloc: ^8.1.5
  copy_with_extension_gen: ^10.0.1

  flutter:
    sdk: flutter

  shared_preferences: 2.2.3


  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  dio: ^5.4.2+1
  pretty_dio_logger: ^1.3.1
  flutter_gen: ^5.12.0
  flutter_svg: 2.0.7
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.13.1


  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  flutter_lints: ^5.0.0




flutter_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/pic.jpg"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/svg/



